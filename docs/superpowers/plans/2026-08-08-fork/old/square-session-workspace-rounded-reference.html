.attention.needs { border-color:color-mix(in srgb,var(--bad) 45%,var(--border));background:var(--bad-soft); }
.attention-label { font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.06em; }
.attention strong { display:block;font-size:11px; }
.attention p { margin:1px 0 0;color:var(--muted); }
.attention-actions { display:flex;gap:5px;justify-content:flex-end; }
.session-nav { height:31px;display:flex;align-items:end;padding:0 9px;border-bottom:1px solid var(--border);background:var(--panel); }
.session-view-btn { height:29px;padding:0 9px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted); }
.session-view-btn:hover { color:var(--text);background:var(--panel-hover); }
.session-view-btn.active { color:var(--text);border-bottom-color:var(--accent); }
.session-content { min-height:0;overflow:hidden; }
.workbench { height:100%;display:grid;grid-template-columns:minmax(285px,31%) minmax(0,1fr); }

.thread { min-height:0;overflow:auto;padding:9px 10px 12px; }
.message { margin-bottom:12px; }
.message-head { display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em; }

.message.user .message-body { border-left-color:var(--accent); }
.message.task-manager .message-body { border-left-color:var(--good); }
.message.orchestrator .message-body { border-left-color:var(--review); }

.composer { padding:8px;border-top:1px solid var(--border);background:var(--panel-alt); }

.workflow-step:first-child { border-radius:3px 0 0 3px; }
.workflow-step:last-of-type { border-right:1px solid var(--border);border-radius:0 3px 3px 0; }
.workflow-step.current { background:var(--accent-soft);color:var(--accent); }

.workflow-step.wait { color:var(--muted); }
.workflow-spacer { flex:1; }

.dock-head { min-height:37px;display:flex;align-items:center;gap:7px;padding:5px 6px;border-bottom:1px solid var(--border);background:var(--panel-alt); }

.dock-head-spacer { flex:1; }

.dock-tool { width:22px;height:22px;border:0;background:transparent;color:var(--muted);border-radius:2px; }
.dock-tool:hover { color:var(--text);background:var(--panel-hover); }
.dock-meta { min-height:24px;display:flex;align-items:center;gap:9px;padding:0 7px;border-bottom:1px solid var(--border);font-size:9px;color:var(--muted);overflow:hidden;white-space:nowrap; }
.dock-meta span { overflow:hidden;text-overflow:ellipsis; }
.terminal-output { flex:1;min-height:92px;margin:0;padding:7px 8px;background:var(--terminal);color:var(--terminal-text);font:10.5px/1.45 var(--mono);white-space:pre-wrap;overflow:hidden; }
.terminal-output .dim { color:#79818b; }.terminal-output .ok { color:#8bd49c; }.terminal-output .warn { color:#e5c07b; }.terminal-output .bad { color:#f48771; }.terminal-output .info { color:#75b8f3; }

<style id="square-rounded-reference-theme">

        {id:'memory-reviewer',span:6,role:'Security Reviewer',title:'Verify memory cannot self-authorize policy',state:'review',stateText:'Reviewing',route:'Codex CLI',model:'GPT-5.6 mini',process:'PID 25540 · 6m',worktree:'immutable diff',progress:43,bodyType:'terminal',lines:'[review] checking trust boundary\n[review] project candidate cannot mutate global memory\n[review] owner promotion event is durable\n[review] testing stale evidence rejection\n<span class="info">→ 7/12 criteria checked</span>',footer:'read-only review'}
      ],
      tasks:[['T-MEM-01','Memory schema','DONE'],['T-MEM-02','Promotion policy','DONE'],['T-MEM-03','Storage implementation','WORKING'],['T-MEM-04','Memory browser','WORKING'],['T-MEM-R1','Authority review','IN REVIEW']],
      criteria:[['AC-MEM-01','Project and global memory are distinct scopes.','PASS'],['AC-MEM-02','Candidate practice cannot promote itself.','PASS'],['AC-MEM-03','Promotion retains provenance and evidence.','PENDING'],['AC-MEM-04','Deprecated practices remain historically visible.','PENDING']],
      history:[['08:47:02','request','Memory session created'],['09:02:18','plan','Plan accepted'],['09:04:31','dispatch','Storage and UI workers started'],['09:18:55','validation','Storage unit suite passed'],['09:24:14','review','Independent review started']]
    },
    {
      id:'docs-session', title:'Clean up architecture handover documents', short:'Docs cleanup', state:'done', stateText:'Done', group:'Completed', attentionCount:0,
      profile:'QUICK', project:'square-orchestrator', branch:'docs/handover-cleanup', pr:'#17 merged', started:'Yesterday', view:'workbench', selectedDock:'docs-worker',
      summary:{working:0,waiting:0,review:0,done:2}, attention:null,
      workflow:[['Task manager','done'],['Worker','done'],['Validation','done'],['Receipt','done']], currentNote:'Completed · receipt accepted',
      messages:[
        {role:'You',kind:'user',time:'Yesterday 16:02',body:'Remove duplicated architecture notes and repair the handover links. Do not change production code.'},
        {role:'Task Manager',kind:'task-manager',time:'Yesterday 16:02',body:'QUICK. One documentation worker, narrow write scope and link validation only.'},
        {role:'Documentation Worker',kind:'orchestrator',time:'Yesterday 16:14',body:'Completed. Four duplicates removed, three links repaired, no production file changed.'}
      ],
      docks:[
        {id:'docs-manager',span:4,role:'Task Manager',title:'Compile QUICK contract and receipt',state:'done',stateText:'Done',route:'Square service',model:'No model',process:'ended',worktree:'session state',progress:100,bodyType:'summary',summary:[['Profile','QUICK'],['Task','One bounded worker'],['Validation','Markdown links + git diff'],['Receipt','RCPT-DOC-017']],footer:'completed yesterday'},
        {id:'docs-worker',span:8,role:'Documentation Worker',title:'Repair handover documents and links',state:'done',stateText:'Done',route:'Codex CLI',model:'GPT-5.6 mini',process:'ended · 11m',worktree:'wt/docs-cleanup',progress:100,bodyType:'terminal',lines:'$ markdown-link-check docs/**/*.md\n<span class="ok">✓ 37 documents checked</span>\n<span class="ok">✓ 0 broken local links</span>\n$ git diff --stat\n 7 files changed, 42 insertions(+), 119 deletions(-)\n<span class="ok">receipt written: RCPT-DOC-017</span>',footer:'PR #17 merged · history retained'}
      ],
      tasks:[['T-DOC-01','Remove duplicates and repair links','DONE'],['T-DOC-V1','Validate links and non-change scope','DONE']],
      criteria:[['AC-DOC-01','No production source file changes.','PASS'],['AC-DOC-02','All local Markdown links resolve.','PASS'],['AC-DOC-03','Completion receipt binds the merged commit.','PASS']],
      history:[['Yesterday 16:02','request','QUICK session created'],['Yesterday 16:03','dispatch','Documentation worker started'],['Yesterday 16:12','validation','Link validation passed'],['Yesterday 16:14','receipt','Completion receipt accepted'],['Yesterday 16:18','merge','PR #17 merged']]
    }
  ];

  let activeSessionId = sessions[0].id;
  let openSessionIds = [sessions[0].id,sessions[1].id,sessions[2].id];
  let filter = 'all';
  let search = '';
  const app = document.getElementById('app');
  const listEl = document.getElementById('sessionList');
  const tabsEl = document.getElementById('sessionTabs');
  const rootEl = document.getElementById('sessionRoot');
  const overlay = document.getElementById('focusOverlay');
  const toast = document.getElementById('toast');

  const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
  const statusClass = s => ['needs','blocked','working','review','done'].includes(s) ? s : 'working';
  const dotClass = s => s==='needs'?'bad':s==='blocked'?'warn':s==='done'?'good':s==='review'?'review':'work';
  const showToast = text => { toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200); };
  const sessionById = id => sessions.find(s=>s.id===id);

  function renderList(){
    const groups=['Needs you','Active','Completed'];
    const visible=sessions.filter(s=>{
      const matchSearch=(s.title+' '+s.project).toLowerCase().includes(search.toLowerCase());
      const matchFilter=filter==='all'||(filter==='attention'&&(s.state==='needs'||s.state==='blocked'))||(filter==='active'&&(s.state==='working'||s.state==='review'))||(filter==='done'&&s.state==='done');
      return matchSearch&&matchFilter;
    });
    listEl.innerHTML=groups.map(group=>{
      const items=visible.filter(s=>s.group===group);
      if(!items.length)return '';
      return `<div class="session-group-label">${group}</div>${items.map(s=>`
        <button class="session-item ${s.id===activeSessionId?'selected':''}" data-session="${s.id}">
          <i class="dot ${dotClass(s.state)}" style="margin-top:5px"></i>
          <span><span class="session-item-title">${esc(s.title)}</span><span class="session-item-sub">${esc(s.profile)} · ${s.summary.working+s.summary.waiting+s.summary.review} active · ${esc(s.started)}</span></span>
          ${s.attentionCount?`<span class="session-badge attn">${s.attentionCount}</span>`:`<span class="session-badge">${s.summary.done}</span>`}
        </button>`).join('')}`;
    }).join('') || `<div style="padding:18px;color:var(--muted)">No matching sessions.</div>`;
    listEl.querySelectorAll('[data-session]').forEach(b=>b.addEventListener('click',()=>openSession(b.dataset.session)));
  }

  function renderTabs(){
    tabsEl.innerHTML=openSessionIds.map(id=>{
      const s=sessionById(id);if(!s)return '';
      return `<button class="session-tab ${id===activeSessionId?'active':''}" data-tab="${id}"><i class="dot ${dotClass(s.state)}"></i><span class="session-tab-title">${esc(s.short)}</span><span class="tab-close" data-close="${id}" aria-label="Close tab">×</span></button>`;
    }).join('')+`<button class="tab-plus" id="tabPlus" title="New session">＋</button>`;
    tabsEl.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',e=>{if(e.target.dataset.close)return;openSession(b.dataset.tab);}));
    tabsEl.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();closeTab(b.dataset.close);}));
    document.getElementById('tabPlus').addEventListener('click',createNewSession);
  }

  function openSession(id){
    if(!openSessionIds.includes(id))openSessionIds.push(id);
    activeSessionId=id;renderAll();
  }
  function closeTab(id){
    if(openSessionIds.length===1)return showToast('Keep at least one session tab open.');
    openSessionIds=openSessionIds.filter(x=>x!==id);
    if(activeSessionId===id)activeSessionId=openSessionIds[openSessionIds.length-1];
    renderAll();
  }
  function createNewSession(){
    const id='new-'+Date.now();
    sessions.unshift({id,title:'Untitled session',short:'New session',state:'working',stateText:'Draft',group:'Active',attentionCount:0,profile:'AUTO',project:'square-orchestrator',branch:'not created',pr:'No PR',started:'just now',view:'workbench',selectedDock:null,summary:{working:0,waiting:0,review:0,done:0},attention:null,workflow:[],currentNote:'Describe the outcome to begin',messages:[],docks:[],tasks:[],criteria:[],history:[]});
    openSessionIds.push(id);activeSessionId=id;renderAll();
    setTimeout(()=>document.getElementById('emptyTask')?.focus(),50);
  }

  function stateLabel(s){ return `<span class="state-label ${statusClass(s.state)}"><i class="dot ${dotClass(s.state)}"></i>${esc(s.stateText)}</span>`; }
  function renderAttention(s){
    if(!s.attention)return '';
    return `<div class="attention ${s.attention.kind==='needs'?'needs':''}">
      <div class="attention-label">${esc(s.attention.label)}</div>
      <div><strong>Problem</strong><p>${esc(s.attention.problem)}</p></div>
      <div class="solution"><strong>Suggested solution</strong><p>${esc(s.attention.solution)}</p></div>
      <div class="attention-actions">${s.attention.actions.map((a,i)=>`<button class="btn small ${i===0?'primary':''} ${a.includes('Stop')?'danger':''}" data-attention-action="${i}">${esc(a)}</button>`).join('')}</div>
    </div>`;
  }
  function renderHeader(s){
    return `<header class="session-header">
      <div class="session-heading"><div class="session-title-row"><div class="session-title">${esc(s.title)}</div>${stateLabel(s)}</div><div class="session-meta">${esc(s.project)} · ${esc(s.profile)} · ${esc(s.branch)} · ${esc(s.pr)} · started ${esc(s.started)}</div></div>
      <div class="session-pulse"><span class="pulse-item"><i class="dot work"></i><strong>${s.summary.working}</strong> working</span><span class="pulse-item"><i class="dot bad"></i><strong>${s.summary.waiting}</strong> waiting</span><span class="pulse-item"><i class="dot review"></i><strong>${s.summary.review}</strong> review</span><span class="pulse-item"><i class="dot good"></i><strong>${s.summary.done}</strong> done</span></div>
      <div class="session-actions"><button class="btn small hide-small" data-session-action="pause">Ⅱ Pause</button><button class="btn small hide-small" data-session-action="history">History</button><button class="btn small danger" data-session-action="stop">Stop</button></div>
    </header>`;
  }
  function renderNav(s){
    return `<nav class="session-nav" aria-label="Session views">${[['workbench','Workbench'],['conversation','Conversation'],['plan','Plan & review'],['history','History']].map(([v,l])=>`<button class="session-view-btn ${s.view===v?'active':''}" data-view="${v}">${l}</button>`).join('')}</nav>`;
  }
  function renderMessages(s,full=false){
    return s.messages.map(m=>`<article class="message ${m.kind}"><div class="message-head"><span class="message-role"><i class="dot ${m.kind==='user'?'work':m.kind==='task-manager'?'good':m.kind==='system'?'warn':'review'}"></i>${esc(m.role)}</span><time>${esc(m.time)}</time></div><div class="message-body">${esc(m.body)}</div></article>`).join('') || `<div style="color:var(--muted);padding:8px">This session has no messages yet.</div>`;
  }
  function renderWorkflowStrip(s){
    return `<div class="workflow-strip">${s.workflow.map(([name,state])=>`<div class="workflow-step ${state}"><i class="dot ${state==='done'?'good':state==='current'?'work':''}"></i>${esc(name)}</div>`).join('')}<span class="workflow-spacer"></span><span class="workflow-note">${esc(s.currentNote)}</span></div>`;
  }
  function renderDockBody(d){
    if(d.bodyType==='summary')return `<dl class="dock-summary">${d.summary.map(([k,v])=>`<div class="dock-summary-row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
    return `<pre class="terminal-output">${d.lines}</pre>`;
  }
  function renderDock(d,s){
    return `<section class="dock span-${d.span} ${d.id===s.selectedDock?'selected':''}" data-dock="${d.id}">
      <header class="dock-head"><span class="dock-role">${esc(d.role)}</span><span class="dock-title">${esc(d.title)}</span><span class="dock-head-spacer"></span><span class="state-label ${statusClass(d.state)}"><i class="dot ${dotClass(d.state)}"></i>${esc(d.stateText)}</span><span class="dock-tools"><button class="dock-tool" data-focus-dock="${d.id}" title="Focus terminal">□</button><button class="dock-tool" data-dock-history="${d.id}" title="Open history">⋯</button></span></header>
      <div class="dock-meta"><span>${esc(d.route)} · ${esc(d.model)}</span><span>${esc(d.process)}</span><span>${esc(d.worktree)}</span></div>
      ${renderDockBody(d)}
      <footer class="dock-footer"><span>${esc(d.footer)}</span><span class="progress"><i style="width:${d.progress}%"></i></span><span>${d.progress}%</span></footer>
    </section>`;
  }
  function renderWorkbench(s){
    if(!s.docks.length)return `<div class="empty-workflow"><div class="empty-inner"><h2>Start a new Square session</h2><p>Describe the result you want as naturally as you would in a chat. Square will create the task manager, planning and agent workflow inside this session only.</p><div class="empty-composer"><textarea id="emptyTask" placeholder="Example: Review the AO fork and implement a session-focused workspace without changing the daemon lifecycle."></textarea><button class="btn primary" id="startEmptySession">Start session</button></div></div></div>`;
    return `<div class="workbench">
      <section class="thread-pane"><div class="pane-heading"><span>Session conversation</span><span style="color:var(--muted)">${s.messages.length} messages</span></div><div class="thread">${renderMessages(s)}</div><div class="composer"><textarea id="sessionComposer" placeholder="Message this session, change scope, answer a question…"></textarea><div class="composer-footer"><div class="quick-actions"><button class="btn small ghost" data-quick="status">Ask status</button><button class="btn small ghost" data-quick="scope">Change scope</button><button class="btn small ghost" data-quick="validate">Run checks</button></div><button class="btn small primary" id="sendSessionMessage">Send</button></div></div></section>
      <section class="workflow-pane">${renderWorkflowStrip(s)}<div class="dock-scroll"><div class="dock-grid">${s.docks.map(d=>renderDock(d,s)).join('')}</div></div></section>
    </div>`;
  }
  function renderConversation(s){
    return `<div class="conversation-view"><div class="conversation-layout"><section class="conversation-card"><div class="pane-heading"><span>${esc(s.title)}</span><span>${esc(s.profile)} workflow</span></div><div class="thread">${renderMessages(s,true)}</div></section><div class="composer"><textarea id="sessionComposer" placeholder="Continue this session…"></textarea><div class="composer-footer"><span style="color:var(--muted)">Messages become durable session instructions.</span><button class="btn primary" id="sendSessionMessage">Send to session</button></div></div></div></div>`;
  }
  function renderPlan(s){
    return `<div class="plan-view"><div class="plan-layout"><section class="plan-card"><div class="plan-card-head"><span>Task plan</span><span>${s.tasks.length} tasks</span></div><div class="plan-card-body">${s.tasks.map(t=>`<div class="task-row"><span class="task-id">${esc(t[0])}</span><span>${esc(t[1])}</span><span class="task-status state-label ${t[2]==='DONE'?'done':t[2].includes('BLOCK')||t[2].includes('NEEDS')?'blocked':t[2].includes('REVIEW')?'review':'working'}">${esc(t[2])}</span></div>`).join('')||'<p style="color:var(--muted)">No plan compiled yet.</p>'}</div></section><section class="plan-card"><div class="plan-card-head"><span>Acceptance & review</span><span>immutable result boundary</span></div><div class="plan-card-body">${s.criteria.map(c=>`<div class="criteria-row"><span class="task-id">${esc(c[0])}</span><span>${esc(c[1])}</span><span class="state-label ${c[2]==='PASS'?'done':c[2]==='FAIL'?'needs':'working'}">${esc(c[2])}</span></div>`).join('')||'<p style="color:var(--muted)">Acceptance criteria will appear after planning.</p>'}</div></section></div></div>`;
  }
  function renderHistory(s){
    return `<div class="history-view"><div class="history-list"><div class="plan-card-head"><span>Durable session history</span><span>terminals remain attached to this session</span></div>${s.history.map(h=>`<div class="history-row"><span class="history-time">${esc(h[0])}</span><span class="history-kind">${esc(h[1])}</span><span>${esc(h[2])}</span><button class="btn small ghost">Open evidence</button></div>`).join('')||'<div style="padding:14px;color:var(--muted)">No history yet.</div>'}</div></div>`;
  }
  function renderContent(s){
    if(s.view==='conversation')return renderConversation(s);
    if(s.view==='plan')return renderPlan(s);
    if(s.view==='history')return renderHistory(s);
    return renderWorkbench(s);
  }

  function renderSession(){
    const s=sessionById(activeSessionId);
    rootEl.innerHTML=renderHeader(s)+renderAttention(s)+renderNav(s)+`<div class="session-content">${renderContent(s)}</div>`;
    rootEl.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{s.view=b.dataset.view;renderSession();}));
    rootEl.querySelectorAll('[data-session-action]').forEach(b=>b.addEventListener('click',()=>{
      if(b.dataset.sessionAction==='history'){s.view='history';renderSession();}
      else if(b.dataset.sessionAction==='pause')showToast('Dispatch paused for this session only. Running agent processes continue safely.');
      else showToast('Stop requires an explicit confirmation in the production interface.');
    }));
    rootEl.querySelectorAll('[data-attention-action]').forEach(b=>b.addEventListener('click',()=>resolveAttention(s,Number(b.dataset.attentionAction))));
    rootEl.querySelectorAll('[data-dock]').forEach(d=>d.addEventListener('click',e=>{if(e.target.closest('button'))return;s.selectedDock=d.dataset.dock;renderSession();}));
    rootEl.querySelectorAll('[data-focus-dock]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openFocus(s,b.dataset.focusDock);}));
    rootEl.querySelectorAll('[data-dock-history]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();s.view='history';renderSession();}));
    rootEl.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{const c=document.getElementById('sessionComposer');if(c)c.value=b.dataset.quick==='status'?'Give me a concise status: progress, blockers, decisions and next step.':b.dataset.quick==='scope'?'I need to amend the scope: ': 'Run the currently authorized targeted checks and report only failures.';}));
    document.getElementById('sendSessionMessage')?.addEventListener('click',()=>sendMessage(s));
    document.getElementById('startEmptySession')?.addEventListener('click',()=>startEmpty(s));
  }

  function resolveAttention(s,index){
    const action=s.attention?.actions[index];if(!action)return;
    if(action.includes('Stop'))return showToast('The production action would show the exact stop scope before confirmation.');
    s.messages.push({role:'You',kind:'user',time:'now',body:`Decision: ${action}.`});
    s.messages.push({role:'Task Manager',kind:'task-manager',time:'now',body:`Decision acknowledged. The affected task has resumed; all other session history remains unchanged.`});
    s.attention=null;s.attentionCount=0;s.state='working';s.stateText='Working';s.group='Active';
    const affected=s.docks.find(d=>d.state==='needs'||d.state==='blocked');if(affected){affected.state='working';affected.stateText='Working';affected.footer='resumed after owner decision';affected.lines=(affected.lines||'')+'\n<span class="ok">owner decision acknowledged · resuming</span>';}
    s.summary.waiting=0;s.summary.working=Math.max(1,s.summary.working+1);s.history.push(['now','decision',action+' accepted']);
    renderAll();showToast(action+' — session resumed.');
  }
  function sendMessage(s){
    const c=document.getElementById('sessionComposer');if(!c||!c.value.trim())return;
    const text=c.value.trim();s.messages.push({role:'You',kind:'user',time:'now',body:text});s.messages.push({role:'Task Manager',kind:'task-manager',time:'now',body:'Instruction recorded for this session. I will amend only the affected task or open a decision if it changes architecture or scope.'});s.history.push(['now','instruction','User message added to session']);c.value='';renderSession();showToast('Message added to '+s.short+'.');
  }
  function startEmpty(s){
    const c=document.getElementById('emptyTask');if(!c||!c.value.trim())return;
    const text=c.value.trim();s.title=text.length>54?text.slice(0,54)+'…':text;s.short=s.title;s.profile='AUTO → PLANNED';s.branch='not created';s.state='working';s.stateText='Planning';s.messages=[{role:'You',kind:'user',time:'now',body:text},{role:'Task Manager',kind:'task-manager',time:'now',body:'Session created. I am compiling the Task Brief and deciding whether planning or a direct QUICK worker is appropriate.'}];s.workflow=[['Task manager','current'],['Planner','wait'],['Orchestrator','wait'],['Workers','wait'],['Review','wait']];s.currentNote='Intake and triage';s.summary={working:1,waiting:0,review:0,done:0};s.docks=[{id:'new-manager',span:12,role:'Task Manager',title:'Compile Task Brief and workflow profile',state:'working',stateText:'Running',route:'Square deterministic service',model:'No model',process:'svc · new workflow',worktree:'no worktree yet',progress:12,bodyType:'terminal',lines:'[now] user task accepted\n[now] canonical project context loaded\n[now] evaluating scope, risk and context need\n<span class="info">→ workflow will appear in this session</span>',footer:'intake · no writer active'}];s.tasks=[];s.criteria=[];s.history=[['now','request','Session created from chat task'],['now','triage','Task Brief compilation started']];renderAll();showToast('Session workflow started.');
  }
  function openFocus(s,dockId){
    const d=s.docks.find(x=>x.id===dockId);if(!d)return;
    overlay.innerHTML=`<header class="dock-head"><span class="dock-role">${esc(d.role)}</span><span class="dock-title">${esc(d.title)}</span><span class="dock-head-spacer"></span>${stateLabel({state:d.state,stateText:d.stateText})}<button class="btn small" id="closeFocus">Close</button></header><div class="dock-meta"><span>${esc(d.route)} · ${esc(d.model)}</span><span>${esc(d.process)}</span><span>${esc(d.worktree)}</span></div>${renderDockBody(d)}<footer class="dock-footer"><span>${esc(d.footer)}</span><span class="progress"><i style="width:${d.progress}%"></i></span><span>${d.progress}%</span></footer>`;
    overlay.classList.add('open');document.getElementById('closeFocus').addEventListener('click',()=>overlay.classList.remove('open'));
  }
  function renderAll(){ renderList();renderTabs();renderSession();updateGlobal(); }
  function updateGlobal(){ const active=sessions.reduce((n,s)=>n+s.summary.working+s.summary.waiting+s.summary.review,0);const att=sessions.reduce((n,s)=>n+s.attentionCount,0);document.getElementById('globalActive').textContent=active+' active processes';document.getElementById('globalAttention').textContent=att+' need you'; }

  document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderList();}));
  document.getElementById('sessionSearch').addEventListener('input',e=>{search=e.target.value;renderList();});
  document.getElementById('newSessionTop').addEventListener('click',createNewSession);
  document.getElementById('newSessionSide').addEventListener('click',createNewSession);
  document.getElementById('themeToggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';});
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey&&e.key.toLowerCase()==='n'){e.preventDefault();createNewSession();}
    if(e.ctrlKey&&['1','2','3','4'].includes(e.key)){e.preventDefault();const s=sessionById(activeSessionId);s.view=['workbench','conversation','plan','history'][Number(e.key)-1];renderSession();}
    if(e.key==='Escape')overlay.classList.remove('open');
  });
  renderAll();
})();
</script>
</body>
